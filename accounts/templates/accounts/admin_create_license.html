{% extends 'base.html' %}
{% block title %}صدور لایسنس{% endblock %}

{% block content %}
<h1>صدور لایسنس برای {{ agency.agency_name }}</h1>
<form method="post" class="property-form">
    {% csrf_token %}
    <div class="form-row">
        <label>مدت اعتبار (روز):</label>
        <input type="number" name="duration_days" value="365" class="form-control" required>
    </div>
    <div class="form-row">
        <label>مبلغ پرداختی (تومان):</label>
        <input type="number" name="amount" value="0" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">صدور لایسنس</button>
    <a href="{% url 'accounts:admin_agencies' %}" class="btn btn-outline">انصراف</a>
</form>
{% endblock %}
