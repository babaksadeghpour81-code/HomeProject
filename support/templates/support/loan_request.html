{% extends 'base.html' %}
{% block title %}درخواست وام بانکی{% endblock %}

{% block content %}
<h1>درخواست وام بانکی</h1>
<form method="post" class="property-form">
    {% csrf_token %}
    {% for field in form %}
        <div class="form-row">
            <label>{{ field.label }}:</label>
            {{ field }}
            {% if field.errors %}<div class="alert alert-error">{{ field.errors }}</div>{% endif %}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">ارسال درخواست</button>
</form>
{% endblock %}
