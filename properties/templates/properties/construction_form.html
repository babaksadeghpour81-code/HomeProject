{% extends 'base.html' %}
{% block title %}ثبت پروژه{% endblock %}

{% block content %}
<h1>ثبت پروژه ساخت و ساز</h1>
<form method="post" enctype="multipart/form-data" class="property-form">
    {% csrf_token %}
    {% for field in form %}
        <div class="form-row">
            <label>{{ field.label }}:</label>
            {{ field }}
            {% if field.errors %}<div class="alert alert-error">{{ field.errors }}</div>{% endif %}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">ثبت پروژه</button>
</form>
{% endblock %}
